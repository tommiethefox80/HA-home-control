name: Home Control
version: "1.3.0"
slug: home_control
description: Heating and lighting for the whole house in one panel. Room heating schedules with boiler control, lights and sockets with dimming schedules and scenes, and one Away for both
url: https://github.com/tommiethefox80/ha-home-control
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:home-automation
panel_title: Home
panel_admin: false
homeassistant_api: true
# homeassistant_config: to keep the dashboard card in Home Assistant's www folder up to date
# backup (read only): to move in from the Home Control that was installed by hand
map:
  - homeassistant_config:rw
  - backup:ro
options: {}
schema: {}
